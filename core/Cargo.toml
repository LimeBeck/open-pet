[package]
name = "openpet-core"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Domain core for open-pet: behavior state machine and host-facing C ABI"

# Ядро не тянет зависимости ради удобства. Исключение — разбор недоверенного
# ввода: свой парсер JSON для чужого manifest.json опаснее чужого проверенного
# (ADR-007). Каждое новое исключение обосновывается отдельно.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Распаковка чужого архива — тот же случай, что и разбор чужого JSON
# (ADR-007): свой распаковщик zip опаснее чужого проверенного.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lib]
name = "openpet_core"
crate-type = ["staticlib", "rlib"]

[profile.release]
# panic = "abort" убил бы catch_unwind на границе FFI и вместе с ним весь
# процесс хоста. Разворачивание стека здесь обязательно (ADR-001, правило 5).
panic = "unwind"
