name: Release

on:
  push:
    tags:
      - "v*"

# Права нужны только на запись релиза. Токен по умолчанию имеет больше,
# чем требуется, поэтому сужаем явно.
permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    # Тот же контейнер, что и в CI: релиз должен собираться ровно там же,
    # где проверяется каждый коммит, иначе проверки ничего не гарантируют.
    container: archlinux:base-devel

    steps:
      - name: Зависимости
        run: |
          # github-cli нужен на последнем шаге: в базовом образе Arch его нет,
          # и первый релиз упал именно на этом — собрав и упаковав всё остальное.
          pacman -Syu --noconfirm --needed \
            git cmake ninja rust github-cli \
            qt6-base qt6-declarative qt6-wayland \
            layer-shell-qt kidletime kwallet

      # Контейнер работает от root, а каталог checkout принадлежит другому
      # пользователю: git считает такой репозиторий подозрительным и отказывается
      # с ним работать, а gh спрашивает у git, куда публиковать.
      - name: Доверие к каталогу сборки
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      # Тег и версия проекта обязаны совпадать. Разойдясь однажды, они
      # разойдутся навсегда: пользователь будет ставить v0.2.0, а приложение
      # сообщать 0.1.0, и понять, что именно у него установлено, станет нельзя.
      - name: Сверка версии с тегом
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(grep -m1 -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          CARGO_VERSION=$(grep -m1 -oP '^version = "\K[^"]+' core/Cargo.toml)

          echo "тег: $TAG, CMake: $CMAKE_VERSION, Cargo: $CARGO_VERSION"

          if [ "$TAG" != "$CMAKE_VERSION" ] || [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::версия тега не совпадает с версией проекта"
            exit 1
          fi

      - name: Проверки ядра
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path core/Cargo.toml

      - name: Сборка
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Установка в стейджинг
        run: cmake --install build --prefix "$PWD/stage/usr" --strip

      - name: Архив
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="open-pet-${VERSION}-x86_64"
          tar --zstd -C stage -cf "${NAME}.tar.zst" usr
          sha256sum "${NAME}.tar.zst" > "${NAME}.tar.zst.sha256"
          echo "ASSET=${NAME}.tar.zst" >> "$GITHUB_ENV"

      - name: Состав архива
        run: tar --zstd -tf "$ASSET"

      # Список изменений собирается из коммитов между тегами и группируется
      # по типу. Автогенерация GitHub даёт плоский список заголовков вперемешку
      # с правками опечаток — по нему нельзя понять, что появилось нового.
      - name: Список изменений
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..${GITHUB_REF_NAME}"
            echo "изменения с $PREVIOUS"
          else
            RANGE="$GITHUB_REF_NAME"
            echo "первый релиз"
          fi

          section() {
            # $1 — префиксы через |, $2 — заголовок
            local body
            body=$(git log --no-merges --pretty=format:'%s' "$RANGE" \
                   | grep -E "^($1)(\(.*\))?:" || true)
            [ -z "$body" ] && return 0
            printf '### %s\n\n' "$2" >> changelog.md
            # Из заголовка убирается технический префикс: «feat(M6): текст».
            echo "$body" | sed -E 's/^[a-z]+(\([^)]*\))?: *//' \
                         | sed -E 's/^(.)/- \1/' >> changelog.md
            printf '\n' >> changelog.md
          }

          section 'feat' 'Что нового'
          section 'fix' 'Исправления'
          section 'perf' 'Быстродействие'
          section 'docs|spec' 'Документация и решения'
          section 'test|ci|build|chore|refactor|style|release' 'Внутреннее'

          if [ ! -s changelog.md ]; then
            echo "- см. список коммитов" > changelog.md
          fi

          if [ -n "$PREVIOUS" ]; then
            printf '\n**Полный список:** %s...%s\n' "$PREVIOUS" "$GITHUB_REF_NAME" >> changelog.md
          fi

          cat changelog.md

      - name: Публикация
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Архив собран из бинарников для x86_64 под Arch с Qt 6.11.
          # Обещать совместимость с другими дистрибутивами нельзя, и об этом
          # сказано прямо, а не мелким шрифтом.
          cat changelog.md > notes.md
          cat >> notes.md <<'NOTES'

          ## Установка

          ```bash
          tar --zstd -xf open-pet-*-x86_64.tar.zst -C /
          ```

          Собрано на Arch с Qt 6.11 и KDE Frameworks 6. На других дистрибутивах
          и других версиях Qt работоспособность не проверялась — см.
          матрицу совместимости в `docs/reference-system.md`.

          Требуется KDE Plasma 6.2+ на Wayland: питомец живёт в layer-shell
          поверхности, и без неё приложение не запустится.
          NOTES

          # --repo задан явно: так публикация не зависит от того, сумел ли gh
          # опознать репозиторий по состоянию git в контейнере.
          # --generate-notes не используется: он добавляет свой плоский
          # список поверх собранного и дублирует его.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "$ASSET" "${ASSET}.sha256"
