name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ядро проверяется отдельно и первым: у него нет зависимостей от Qt,
  # Wayland и дисплея. Если ломается домен, остальное неважно.
  core:
    name: Ядро (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия toolchain
        run: rustc --version && cargo --version

      - name: Форматирование
        run: cargo fmt --manifest-path core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --manifest-path core/Cargo.toml

  # Сборка хоста идёт в контейнере Arch, а не на ubuntu-latest.
  #
  # Причина не во вкусах: эталонная система проекта — Arch с Plasma 6.7
  # и Qt 6.11, а KF6 и LayerShellQt в Ubuntu отстают на версии и меняют
  # имена пакетов между выпусками. Сборка на том же наборе версий, что
  # у разработчика, ловит расхождения, а не создаёт их.
  #
  # Запустить приложение здесь нельзя — нужен живой композитор Wayland
  # с layer-shell. Проверяется сборка и установка; поведение на реальной
  # Plasma проверяется вручную (§11, E2E).
  desktop:
    name: Хост (Qt/KDE)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # git ставится до checkout: без него actions/checkout сваливается
      # на скачивание архива и теряет историю.
      - name: Зависимости
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja rust \
            qt6-base qt6-declarative qt6-wayland \
            layer-shell-qt kidletime kwallet

      - uses: actions/checkout@v4

      - name: Версии
        run: |
          cmake --version | head -1
          rustc --version
          pacman -Q qt6-base layer-shell-qt kidletime kwallet

      - name: Конфигурация
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Сборка
        run: cmake --build build

      - name: Установка
        run: cmake --install build --prefix "$PWD/dist"

      - name: Состав пакета
        run: find dist -type f
